image_root: '请输入你的服务器路径/datasets/RSTPReid/imgs'
ann_root: '请输入你的服务器路径/datasets/RSTPReid'
dataset: 'retrieval_rstp'

# set pretrained as a file path or an url
pretrained: '请输入你的服务器路径/checkpoint/model_base.pth'

# size of vit model; base or large

vit: 'base'
batch_size_train: 16
batch_size_test: 32
vit_grad_ckpt: True
vit_ckpt_layer: 4
init_lr: 1e-5

# vit: 'large'
# batch_size_train: 16
# batch_size_test: 32
# vit_grad_ckpt: True
# vit_ckpt_layer: 12
# init_lr: 5e-6

image_size: 224
queue_size: 3600
alpha: 0.4
k_test: 32
negative_all_rank: True

# optimizer
weight_decay: 0.05
min_lr: 0
max_epoch: 40

# Occlusion and Token Selection
use_occlusion_and_crop: True
occlusion_prob: 0.3
crop_prob: 0.3
original_prob: 0.4
topk_image_ratio: 0.5
topk_text_ratio: 0.5
max_patch: 256
max_words: 72

# Loss weights
loss_weights:
  global: 1.0
  local: 1.0
  ara: 0.1
  mim: 0.1

